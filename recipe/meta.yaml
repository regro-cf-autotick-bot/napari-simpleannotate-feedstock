{% set name = "napari-simpleannotate" %}
{% set version = "0.1.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz

  sha256: 12175d9e14a18777edd5286ed60df93b4839a88bc4a8540b3b0a27fc438c412f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=42.0.0
    - wheel
  run:
    - napari
    - numpy
    - magicgui
    - python >={{ python_min }}
    - pyyaml
    - qtpy
    - scikit-image
    - pandas
    - napari_video
    - zarr
    - numcodecs
    - opencv

test:
  imports:
    - napari_simpleannotate
  commands:
    - pip list
    - pip check 2>&1 | grep -v "opencv-contrib-python" || true
  requires:
    - pip
    - pyqt
    - python {{ python_min }}

about:
  home: https://pypi.org/project/napari-simpleannotate
  summary: A simple plugin to label image
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/hiroalchem/napari-simpleannotate

extra:
  recipe-maintainers:
    - hiroalchem
    - jaimergp
